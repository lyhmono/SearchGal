name = "searchgal"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# ── 日志 ──
[observability.logs]
enabled = true

# ── 环境变量 ──
[vars]
ENVIRONMENT = "production"

# ── 可选: KV 持久化熔断器状态 ──
# 1. 在 Cloudflare Dashboard → Workers & Pages → KV → 创建命名空间 "SEARCHGAL_KV"
# 2. 取消下面注释，填入你的 KV namespace ID
# [[kv_namespaces]]
# binding = "SEARCHGAL_KV"
# id = "YOUR_KV_NAMESPACE_ID"

# ── 可选: 自定义域名路由 ──
# [[routes]]
# pattern = "searchgal.top/*"
# zone_name = "searchgal.top"
