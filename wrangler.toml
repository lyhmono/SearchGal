"$schema" = "./node_modules/wrangler/config-schema.json"

name = "searchgal"
main = "src/index.ts"
compatibility_date = "2026-05-27"

# 智能放置：自动选择离用户近的数据中心执行，降低跨区延迟
[placement]
mode = "smart"

[observability.logs]
enabled = true

[vars]
ENVIRONMENT = "production"
# ── 可选调参（均可省略，省略时用内置默认值）──
# LOG_LEVEL: 日志级别，默认 "warn"（只记 warn/error，省 Observability 用量）。排查时设 "info"。
# SEARCHGAL_CONCURRENCY: 单搜索并发平台数，默认 6。免费计划触发 CPU 时间超限时调低（如 3）。
# SEARCHGAL_TIMEOUT_MS: 单平台请求超时(毫秒)，默认 12000。免费计划可调低（如 8000）以缩短单次搜索耗时。
# BG_API_URL: 背景图代理上游地址（避免广告拦截器）。默认 https://api.yppp.net/api.php，换源只改这一行。
# SEARCHGAL_SUBREQUEST_BUDGET: 单次调用子请求预算（默认 40）。注意：启用 fan-out 后单批子请求数由
#   SEARCHGAL_BATCH_SIZE × 单平台子请求决定，不再受本预算「跳过」逻辑限制；本值仅作用于非 fan-out 回退路径。
# SEARCHGAL_FANOUT: 是否启用 fan-out 分批（默认 on）。免费计划靠「每批一次独立 Worker 调用」突破 50 子请求上限；
#   设 "off" 回退到单次调用旧逻辑（会重现 Too many subrequests 报错）。
# SEARCHGAL_BATCH_SIZE: 每批平台数（默认 8，上限 20）。单批子请求数 ≈ 批大小 × 单平台子请求，须 < 50。
# LOG_LEVEL = "warn"
# SEARCHGAL_CONCURRENCY = 6
# SEARCHGAL_TIMEOUT_MS = 12000
# BG_API_URL = "https://api.yppp.net/api.php"
# SEARCHGAL_SUBREQUEST_BUDGET = 40
# SEARCHGAL_FANOUT = "on"
# SEARCHGAL_BATCH_SIZE = 8

# 单次调用子请求上限（Cloudflare Workers 平台限制）。
# 免费计划硬上限为 50，无法调高；本仓库通过上方 SEARCHGAL_SUBREQUEST_BUDGET 做优雅降级。
# 若已升级 Workers Paid（默认上限 10,000），可取消下方注释提高上限以获得完整 37 平台覆盖：
# [limits]
# subrequests = 1000

# KV 缓存
[[kv_namespaces]]
binding = "SEARCHGAL_KV"
id = "d547b4afb56146a09d29365560eaf530"
# 如需预览环境使用不同 KV，取消注释下方并创建预览命名空间
# preview_id = "你的预览环境_KV_ID"

# 限流：当前已禁用分布式限流（未配置 Rate Limit 命名空间）。
# 已通过代码内内存限流兜底（limitedMemory），仍可按 IP 限流，但仅在单个 Worker 实例内生效。
# 如需启用跨实例分布式限流，在 Cloudflare 新建 Rate Limit 命名空间后，
# 取消下方注释并填入真实 namespace_id（32 位十六进制）：
# [[ratelimit]]
# name = "SEARCHGAL_RATELIMIT"
# namespace_id = "在此填入32位十六进制ID"
# simple = { limit = 30, period = 60 }
