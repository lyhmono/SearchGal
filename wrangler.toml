"$schema" = "./node_modules/wrangler/config-schema.json"

name = "searchgal"
main = "src/index.ts"
compatibility_date = "2026-05-27"

# 智能放置：自动选择离用户近的数据中心执行，降低跨区延迟
[placement]
mode = "smart"

[observability.logs]
enabled = true

[vars]
ENVIRONMENT = "production"
# ── 可选调参（均可省略，省略时用内置默认值）──
# LOG_LEVEL: 日志级别，默认 "warn"（只记 warn/error，省 Observability 用量）。排查时设 "info"。
# SEARCHGAL_CONCURRENCY: 单搜索并发平台数，默认 6。免费计划触发 CPU 时间超限时调低（如 3）。
# SEARCHGAL_TIMEOUT_MS: 单平台请求超时(毫秒)，默认 12000。免费计划可调低（如 8000）以缩短单次搜索耗时。
# LOG_LEVEL = "warn"
# SEARCHGAL_CONCURRENCY = 6
# SEARCHGAL_TIMEOUT_MS = 12000

# KV 缓存
[[kv_namespaces]]
binding = "SEARCHGAL_KV"
id = "d547b4afb56146a09d29365560eaf530"
# 如需预览环境使用不同 KV，取消注释下方并创建预览命名空间
# preview_id = "你的预览环境_KV_ID"

# 限流：当前已禁用分布式限流（未配置 Rate Limit 命名空间）。
# 已通过代码内内存限流兜底（limitedMemory），仍可按 IP 限流，但仅在单个 Worker 实例内生效。
# 如需启用跨实例分布式限流，在 Cloudflare 新建 Rate Limit 命名空间后，
# 取消下方注释并填入真实 namespace_id（32 位十六进制）：
# [[ratelimit]]
# name = "SEARCHGAL_RATELIMIT"
# namespace_id = "在此填入32位十六进制ID"
# simple = { limit = 30, period = 60 }
